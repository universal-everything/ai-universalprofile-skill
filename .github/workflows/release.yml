name: release

# On a version tag (pushed on the `source` branch): rebuild, verify, then publish the shipped skill
#  - to branch `main` with SKILL.md at the repository root (build/publish-main.mjs adds one
#    commit whose tree is skills/universal-profile/), so
#    `openclaw skills install git:universal-everything/ai-universalprofile-skill` and
#    `npx skills add universal-everything/ai-universalprofile-skill` install exactly the skill, and
#  - as a GitHub release asset universal-profile-<version>.tar.gz + SHA256SUMS
#    (used by agents inside cloud VMs, e.g. Meta Muse, to fetch and verify).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: the tag is the version in package.json and its CHANGELOG entry is dated
        run: node build/version.mjs check --release --tag "$GITHUB_REF_NAME"
      - run: npm run typecheck && npm test
      - name: reproducible build
        run: |
          npm run build
          node build/gen-verb-docs.mjs
          git diff --exit-code -- skills/universal-profile
      - run: npm run verify:skill
      # Outside the checkout: publish-main.mjs (next step) refuses a working tree with untracked files. SHA256SUMS
      # lists the bare file name, so `sha256sum -c SHA256SUMS` works next to the downloaded archive.
      - name: tarball + checksums
        run: |
          V="${GITHUB_REF_NAME#v}"
          mkdir -p "$RUNNER_TEMP/release"
          tar -C skills -czf "$RUNNER_TEMP/release/universal-profile-$V.tar.gz" universal-profile
          (cd "$RUNNER_TEMP/release" && sha256sum "universal-profile-$V.tar.gz" > SHA256SUMS)
      - name: publish the skill to main (SKILL.md at the repository root)
        run: |
          git config user.name "release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          node build/publish-main.mjs --push
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ runner.temp }}/release/universal-profile-*.tar.gz
            ${{ runner.temp }}/release/SHA256SUMS
          generate_release_notes: true
